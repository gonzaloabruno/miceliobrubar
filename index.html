<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap');
/* Layout: tienda de laboratorio. Columna de 1120px, encabezado fijo, fichas tipo etiqueta de muestra. Siempre en crema, como el feed; el verde queda solo en títulos y botones. */
:root{
  --bg:#F7F3EA; --surface:#FCFAF4; --surface-2:#EFE8D8; --heading:#2F3B22; --text:#5A4632; --muted:#76674F;
  --line:#DED4BE; --accent:#5E6B3A; --btn-bg:#2F3B22; --btn-fg:#F4EEE0;
  --band-bg:#E8DEC8; --band-fg:#2F3B22; --band-muted:#6E5F48;
  --ok:#4C6A2A; --warn:#8F611A; --danger:#9B3B2A; --scrim:rgba(30,26,18,.38);
  --f-display:'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;color:var(--heading);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(34px,5.2vw,54px);letter-spacing:-.01em}
h2{font-size:clamp(26px,3.2vw,34px)}
h3{font-size:20px}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;max-width:58ch}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px;top:8px;background:var(--btn-bg);color:var(--btn-fg);padding:8px 12px;z-index:100;border-radius:6px}
.skip:focus{left:16px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-bg);border-radius:999px;padding:12px 22px;font:600 15px/1.2 var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--heading);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.small{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{color:var(--heading);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.link:hover{text-decoration-color:var(--accent)}
.icon-btn{background:none;border:1px solid var(--line);color:var(--heading);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;font:600 16px var(--f-body)}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:16px;height:16px}

/* Cabecera */
.announce{background:var(--band-bg);color:var(--band-fg);font-size:13px}
.announce .wrap{padding-block:7px;text-align:center}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:24px;min-height:66px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--heading)}
.brand svg{width:34px;height:34px;color:var(--accent)}
.brand span{font-family:var(--f-display);font-size:21px;white-space:nowrap}
.main-nav{display:flex;gap:4px;margin-left:auto}
.main-nav a{text-decoration:none;font-size:15px;font-weight:500;padding:8px 12px;border-radius:999px;color:var(--text)}
.main-nav a:hover{color:var(--heading);background:var(--surface-2)}
.main-nav a.active{color:var(--heading);background:var(--surface-2)}
.header-actions{display:flex;align-items:center;gap:8px}
.cart-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;color:var(--heading);font:600 14px var(--f-body);cursor:pointer}
.cart-btn:hover{border-color:var(--accent)}
.cart-btn svg{width:18px;height:18px}
.cart-btn b{min-width:24px;height:24px;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);display:inline-grid;place-items:center;font-size:12px;padding-inline:6px;font-variant-numeric:tabular-nums}
.admin-pill{font:600 13px var(--f-body);color:var(--heading);text-decoration:none;border:1px dashed var(--accent);border-radius:999px;padding:7px 12px;white-space:nowrap}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--heading);font:600 14px var(--f-body);cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:inline-flex}
  .main-nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin:0}
  .main-nav.open{display:flex}
  .main-nav a{padding:12px 14px;font-size:16px}
  .header-actions{margin-left:auto}
}
@media (max-width:520px){ .cart-btn .cart-label{display:none} .brand span{font-size:18px} .admin-pill{display:none} }

/* Secciones */
main{display:block;min-height:60vh}
main:focus{outline:none}
.section{padding-block:56px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.section-head p{max-width:52ch}
.stack{display:flex;flex-direction:column;gap:12px}

/* Inicio */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:56px 40px}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.hero-facts{list-style:none;margin:12px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 32px;font-size:14px}
.hero-facts b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--heading)}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;position:relative;margin:0;min-width:0}
.spec::before{content:"";position:absolute;left:24px;right:24px;top:0;height:6px;background:radial-gradient(circle at 5px 0,var(--bg) 3px,transparent 3.5px) 0 0/14px 6px repeat-x}
.spec-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.spec h2{font-size:28px;margin-top:14px}
.spec h2 i{font-style:italic}
.spec .sub{color:var(--muted);font-size:14px;margin-top:4px}
.stages{list-style:none;margin:18px 0 0;padding:0}
.stages li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:baseline;padding-block:11px;border-top:1px dashed var(--line)}
.stages .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stages b{display:block;color:var(--heading);font-weight:600;font-size:15px}
.stages small{display:block;color:var(--muted);font-size:13px}
.stages .v{font-family:var(--f-mono);font-size:13px;color:var(--heading);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:860px){ .hero{grid-template-columns:1fr;gap:32px;padding-block:36px 24px} }

.paths{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path{display:flex;flex-direction:column;gap:12px;padding:30px;border-radius:var(--r-lg);text-decoration:none;min-height:230px;transition:transform .2s ease}
.path:hover{transform:translateY(-2px)}
.path p{max-width:44ch}
.path .go{margin-top:auto;font-weight:600}
.path-home{background:var(--surface-2);color:var(--text)}
.path-pro{background:var(--band-bg);color:var(--band-fg)}
.path-pro h2{color:var(--band-fg)}
.path-pro .mono{color:var(--band-muted)}
.path svg{width:44px;height:44px}
.path-home svg{color:var(--accent)}
.path-pro svg{color:var(--band-muted)}
@media (max-width:720px){ .paths{grid-template-columns:1fr} }

.strain-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 28px}
.strain-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-block:13px;border-top:1px solid var(--line)}
.strain-list b{color:var(--heading);font-weight:600}
.strain-list i{color:var(--muted);font-size:14px;text-align:right}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:step}
.steps li{padding:20px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.steps b{color:var(--heading);font-size:17px;font-family:var(--f-display);font-weight:400}
.steps p{font-size:14px;color:var(--muted)}
@media (max-width:900px){ .steps{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .steps{grid-template-columns:1fr} }

.band{background:var(--band-bg);color:var(--band-fg);border-radius:var(--r-lg);padding:36px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.band h2{color:var(--band-fg)}
.band p{color:var(--band-muted)}
.band .btn{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.pay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:16px}
.pay-amount{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.pay-amount b{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,40px);color:var(--heading);font-variant-numeric:tabular-nums}
.pay dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 20px;align-items:center}
.pay dt{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pay dd{margin:0;color:var(--heading);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.pay .alias{font:500 20px var(--f-mono);letter-spacing:.02em;word-break:break-all}
.step-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;color:var(--heading)}
.step-title span{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);display:inline-grid;place-items:center;font:500 14px var(--f-mono);color:var(--accent);flex:none}
.result details summary{cursor:pointer;color:var(--heading);font-weight:600;font-size:15px}
.result details pre{margin-top:10px}
@media (max-width:760px){ .band{grid-template-columns:1fr;padding:26px} }

/* Productos */
.page-head{padding-block:40px 8px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding-block:20px 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;max-width:100%}
.tab{flex:none;text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:var(--surface);white-space:nowrap;cursor:pointer;font-family:var(--f-body)}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.tab small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{position:relative;flex:1 1 240px;max-width:320px}
.search input[type=text]{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:15px var(--f-body)}
.search svg{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted)}
.cat-intro{padding:18px 0 4px;color:var(--muted);max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s ease,transform .2s ease}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-link{text-decoration:none;color:inherit;display:flex;flex-direction:column;flex:1}
.media{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);overflow:hidden;position:relative}
.media svg{width:36%;height:auto}
.media img{position:absolute;inset:0;width:100%;height:100%;padding:6%;object-fit:contain;display:block}
.media img.fill{padding:0}
.media img.fill,.thumb img.fill{object-fit:cover}
.card-body{padding:16px 16px 0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card-body h3{font-size:19px}
.card-body p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-family:var(--f-display);font-size:21px;color:var(--heading);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid currentColor;max-width:100%;line-height:1.3}
.badge::before{flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok)}
.badge.warn{color:var(--warn)}
.badge.info{color:var(--muted)}
.card .btn{width:100%}
.empty{padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* Ficha de producto */
.crumbs{font-size:14px;color:var(--muted);padding-top:28px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding-block:20px 56px;align-items:start}
.detail .media{aspect-ratio:1/1;border-radius:var(--r-lg);border:1px solid var(--line)}
.detail .media svg{width:42%}
.detail-info{display:flex;flex-direction:column;gap:18px;min-width:0}
.detail-info h1{font-size:clamp(30px,4vw,42px)}
.detail-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.detail-price .price{font-size:32px}
.tier{font-size:14px;color:var(--ok);font-weight:500}
.desc{font-size:16px;max-width:60ch}
fieldset{border:none;margin:0;padding:0;min-width:0}
legend{font-weight:600;color:var(--heading);margin-bottom:10px;padding:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;background:var(--surface);color:var(--text)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:hover{border-color:var(--accent)}
.chip:has(input:checked){background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip .dot.later{background:var(--warn)}
.buy-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qty button{background:none;border:none;width:40px;height:44px;font:600 18px var(--f-body);color:var(--heading);cursor:pointer}
.qty input{width:44px;text-align:center;border:none;background:transparent;font:600 16px var(--f-body);color:var(--heading);-moz-appearance:textfield;appearance:textfield}
.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty.sm button{width:30px;height:32px;font-size:15px}
.qty.sm input{width:30px;font-size:14px}
.specs{display:grid;grid-template-columns:auto 1fr;margin:0;border-bottom:1px solid var(--line)}
.specs dt,.specs dd{padding-block:11px;border-top:1px solid var(--line);margin:0}
.specs dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:20px;padding-top:13px}
.specs dd{color:var(--heading)}
.note{font-size:14px;color:var(--muted);padding:12px 14px;background:var(--surface-2);border-radius:var(--r-sm)}
@media (max-width:820px){ .detail{grid-template-columns:1fr;gap:24px} .detail .media{aspect-ratio:4/3} }

/* Páginas de texto */
.prose{max-width:68ch;display:flex;flex-direction:column;gap:16px;font-size:17px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:start}
@media (max-width:820px){ .two{grid-template-columns:1fr;gap:28px} }
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.values div{padding:22px;border-top:2px solid var(--accent);background:var(--surface);border-radius:0 0 var(--r-md) var(--r-md);display:flex;flex-direction:column;gap:8px}
.values b{font-family:var(--f-display);font-weight:400;color:var(--heading);font-size:19px}
.values p{font-size:15px;color:var(--muted)}
@media (max-width:760px){ .values{grid-template-columns:1fr} }
.lab-card{background:var(--surface-2);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:14px}
.lab-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px}
.lab-card dt{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.lab-card dd{margin:0;color:var(--heading)}
.ship-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ship-list li{border:1px solid var(--line);border-radius:var(--r-md);padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.ship-list b{color:var(--heading)}
.ship-list span{font-size:14px;color:var(--muted)}
.faq{display:flex;flex-direction:column;max-width:780px}
.faq details{border-top:1px solid var(--line);padding-block:4px}
.faq details:last-child{border-bottom:1px solid var(--line)}

.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 18px;max-width:64ch}

/* Carrito */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:80;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-20px 0 40px rgba(0,0,0,.08)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:26px}
.drawer-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);align-items:start}
.thumb{width:56px;height:56px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;color:var(--accent);overflow:hidden}

.line-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.line-info b{color:var(--heading);font-weight:600;font-size:15px;line-height:1.3}

.line-price{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-variant-numeric:tabular-nums;color:var(--heading);font-weight:600}
.rm{background:none;border:none;color:var(--muted);font:13px var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.rm:hover{color:var(--danger)}
.totals{display:flex;flex-direction:column;gap:8px;padding-top:16px}
.totals div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals .grand{font-family:var(--f-display);font-size:22px;color:var(--heading)}
.drawer-foot{display:flex;flex-direction:column;gap:12px;padding-top:16px}

/* Checkout */
.co-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:start;padding-block:24px 64px}
.co-form{display:flex;flex-direction:column;gap:28px;min-width:0}
.ship-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ship-opt{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 14px 40px;cursor:pointer;background:var(--surface)}
.ship-opt input{position:absolute;left:14px;top:17px;accent-color:var(--accent)}
.ship-opt b{color:var(--heading);font-size:15px}
.ship-opt span{font-size:13px;color:var(--muted)}
.ship-opt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:14px;font-weight:600;color:var(--heading)}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],textarea,select{width:100%;font:16px var(--f-body);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field.err input,.field.err textarea{border-color:var(--danger)}
.field .msg{font-size:13px;color:var(--danger)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;min-width:0}
.summary h2{font-size:22px}
.summary .line{grid-template-columns:44px 1fr auto}
.summary .thumb{width:44px;height:44px}
.result{display:flex;flex-direction:column;gap:16px;max-width:720px;padding-block:24px 64px}
.result pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 var(--f-mono);background:var(--surface-2);color:var(--heading);padding:18px;border-radius:var(--r-md);max-height:340px;overflow:auto;margin:0}
.result .row{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:520px){ .ship-opts,.fields{grid-template-columns:1fr} }

/* Pie */
.site-footer{border-top:1px solid var(--line);margin-top:24px}
.foot{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:32px;padding-block:44px calc(80px + env(safe-area-inset-bottom,0px));font-size:15px}

@media (max-width:720px){ .foot{grid-template-columns:1fr;gap:24px} }

.wa-float{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;background:var(--band-bg);color:var(--band-fg);border:1px solid var(--line);text-decoration:none;font:600 14px var(--f-body);padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.16)}

.toast.show{opacity:1;transform:translate(-50%,0)}
.draft-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px dashed var(--accent);color:var(--heading);border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-width:calc(100% - 32px)}

  /* ---------- Precios y disponibilidad ---------- */
  function unitPrice(p, qty, st) {
    var base = Number(p.price) || 0;

    (p.tiers || []).forEach(function (t) { if (qty >= t.min && t.price < best) best = t.price; });

  function updateCount() { var n = cart.reduce(function (a, l) { return a + l.qty; }, 0); $('#cart-count').textContent = n; }
  function addToCart(id, st, qty) {
    var key = id + '|' + (st || '');
    var line = cart.find(function (l) { return l.key === key; });
    if (line) line.qty += qty; else cart.push({ key: key, id: id, strain: st || null, qty: qty });
    saveCart(); renderDrawer();
    var p = product(id);
    toast('Agregaste ' + qty + ' × ' + p.name + (st ? ' (' + strainName(st) + ')' : ''));
  }
  function cartLines() {
    return cart.map(function (l) {
      var p = product(l.id);
      if (!p || p.visible === false || !canBuy(p)) return null;
      var totalQty = cart.filter(function (x) { return x.id === l.id; }).reduce(function (a, x) { return a + x.qty; }, 0);
      var u = unitPrice(p, totalQty, l.strain);
      return { key: l.key, id: l.id, strain: l.strain, qty: l.qty, p: p, u: u, total: u * l.qty, avail: availOf(p, l.strain) };
    }).filter(Boolean);
  }
  function totals(lines) {
    var subtotal = lines.reduce(function (a, l) { return a + l.total; }, 0);
    var hasPedido = lines.some(function (l) { return l.avail === 'pedido'; });
    var allDigital = lines.length > 0 && lines.every(function (l) { return l.avail === 'digital'; });
    return { subtotal: subtotal, hasPedido: hasPedido, allDigital: allDigital };
  }

  function bindProduct(id) {

      var act = b.dataset.act;
      var item = b.closest('[data-pid]');
      if (act === 'edit') { state.openEditor = state.openEditor === item.dataset.pid ? null : item.dataset.pid; renderAdminPanel(); }
      else if (act === 'new') {
        var id = 'prod-' + Date.now().toString(36);
        cat.products.unshift({ id: id, cat: cat.categories[0].id, name: 'Nuevo producto', short: '', desc: '', price: null, availability: 'stock', strains: [], stockStrains: [], specs: [], tiers: [], icon: 'kit', visible: false, featured: false });
        state.openEditor = id; renderAdminPanel(); var n = $('#n-' + id); if (n) n.focus();
      }
      else if (act === 'noimg') { product(item.dataset.pid).image = null; renderAdminPanel(); }
      else if (act === 'del') {
        if (b.dataset.armed) { cat.products = cat.products.filter(function (p) { return p.id !== item.dataset.pid; }); cart = cart.filter(function (l) { return l.id !== item.dataset.pid; }); saveCart(); state.openEditor = null; renderAdminPanel(); toast('Producto eliminado. Publicá para que se vaya de la tienda.'); }
        else { b.dataset.armed = '1'; b.textContent = 'Tocá de nuevo para eliminar'; setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Eliminar producto'; } }, 4000); }
      }
    });
    $('.adm-tabs').addEventListener('click', function (e) {
      var t = e.target.closest('[data-admtab]'); if (!t) return;
      state.adminTab = t.dataset.admtab;
      $$('[data-admtab]').forEach(function (x) { var on = x === t; x.classList.toggle('active', on); x.setAttribute('aria-selected', on); });
      renderAdminPanel();
    });
    $('#adm-discard').addEventListener('click', function () { cat = clone(published); state.openEditor = null; renderAdminPanel(); toast('Cambios descartados'); });
    $('#adm-publish').addEventListener('click', publishSite);
  }
  function uploadPhoto(input) {
    var file = input.files && input.files[0]; if (!file) return;
    var item = input.closest('[data-pid]'); var p = product(item.dataset.pid);
    setStatus('Subiendo foto…');
    use('assets').then(function (assets) {
      if (!assets) { setStatus('Para subir fotos, abrí la tienda desde tu cuenta de Claude.', 'dirty'); return; }
      var type = /png$/i.test(file.type) ? 'image/png' : /webp$/i.test(file.type) ? 'image/webp' : 'image/jpeg';
      return assets.upload(file, { type: type }).then(function (res) {
        p.image = res.id; renderAdminPanel(); toast('Foto cargada. Publicá para que la vean tus clientes.');
      });
    }).catch(function (err) {
      var c = err && err.code;
      var msg = c === 'too_large' ? 'La foto pesa más de 20 MB. Probá con una más liviana.' :
        c === 'unsupported_type' ? 'Ese formato no se puede subir. Usá JPG, PNG o WEBP.' :
        c === 'quota_or_state' ? 'No queda espacio para más fotos.' : 'No se pudo subir la foto. Probá de nuevo.';
      setStatus(msg, 'dirty');
    });
  }
  function use(name) {
    try { return (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(name)).catch(function () { return null; }) : Promise.resolve(null); }
    catch (e) { return Promise.resolve(null); }
  }
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  function buildDocument() {
    var S = 'scr' + 'ipt';
    var json = JSON.stringify(cat).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<meta name="claude:viewport-fit-sides" content="cover"><title>Micelio Brubar</title>' +
      '<style id="app-style">' + $('#app-style').textContent + '</style>' +
      $('#shell').outerHTML +
      '<div id="root"></div>' +
      '<' + S + ' type="application/json" id="catalog-data">' + json + '</' + S + '>' +
      '<' + S + ' id="app-js">' + $('#app-js').textContent + '</' + S + '>' +
      '</body></html>';
  }
  function publishSite() {
    var btn = $('#adm-publish'); btn.disabled = true; btn.textContent = 'Publicando…';
    use('artifact').then(function (art) {
      if (!art) throw { code: 'not_granted' };
      return art.publish(buildDocument());
    }).then(function () {
      setStatus('Publicado. La tienda se actualiza para todos.');
    }).catch(function (err) {
      var c = err && err.code;
      if (c === 'conflict') setStatus('Se publicó otra versión recién. La página se recarga con esa versión.', 'dirty');
      else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) !== -1) setStatus('Desde esta vista no se pueden guardar cambios. Abrí la tienda desde tu cuenta de Claude.', 'dirty');
      else if (c === 'rate_limited') setStatus('Publicaste muchas veces seguidas. Esperá un minuto y probá de nuevo.', 'dirty');
      else if (c === 'too_large') setStatus('La tienda quedó demasiado grande para publicarse. Quitá algún producto o texto largo.', 'dirty');
      else setStatus('No se pudo publicar. Probá de nuevo en un momento.', 'dirty');
      btn.disabled = false; btn.textContent = 'Publicar cambios';
    });
  }

  /* ---------- Rutas ---------- */
  function route() {
    var h = (location.hash || '').slice(1) || 'inicio';
    closeMenu(); closeDrawer(true);
    var nav = h, after = null, html;
    if (h !== 'checkout') state.result = null;
    if (h === 'inicio') html = viewHome();
    else if (h === 'productos') { html = viewProducts(null); after = function () { renderGrid(null); }; nav = 'productos'; }
    else if (h.indexOf('cat-') === 0) { var cid = h.slice(4); html = viewProducts(cid); after = function () { renderGrid(cid); }; nav = 'productos'; }
    else if (h.indexOf('p-') === 0) { var pid = h.slice(2); html = viewProduct(pid); after = function () { bindProduct(pid); }; nav = 'productos'; }
    else if (h === 'nosotros') html = viewAbout();
    else if (h === 'como-comprar') html = viewHowTo();
    else if (h === 'preguntas') html = viewFaq();
    else if (h === 'checkout') { html = viewCheckout(); after = bindCheckout; nav = ''; }
    else if (h === 'admin') { html = viewAdmin(); after = bindAdmin; nav = ''; }
    else html = viewNotFound();
    view.innerHTML = html;
    if (after) after();
    $$('[data-nav]').forEach(function (a) { var on = a.dataset.nav === nav; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    renderChrome();
    window.scrollTo(0, 0);
  }

  /* ---------- Eventos globales ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var add = t.closest('[data-add]');
    if (add) { e.preventDefault(); addToCart(add.dataset.add, null, 1); return; }
    var c = t.closest('[data-cart]');
    if (c && c.dataset.cart !== 'set') { changeLine(c.dataset.key, c.dataset.cart); return; }
    if (t.closest('#cart-open')) { openDrawer(); return; }
    if (t.closest('#cart-close') || t.closest('#keep-shopping') || t.id === 'scrim') { closeDrawer(); return; }
    if (t.closest('#edit-cart')) { openDrawer(); return; }
    if (t.closest('#menu-btn')) { var nav = $('#main-nav'); var open = !nav.classList.contains('open'); nav.classList.toggle('open', open); $('#menu-btn').setAttribute('aria-expanded', String(open)); return; }
  });
  document.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.cart === 'set') changeLine(el.dataset.key, 'set', el.value); });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search') { state.search = e.target.value; var h = (location.hash || '').slice(1); renderGrid(h.indexOf('cat-') === 0 ? h.slice(4) : null); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); closeMenu(); } });
  window.addEventListener('hashchange', route);

  updateCount();
  route();

  use('user').then(function (u) {
    if (!u) return false;
    return Promise.all([u.isOwner(), u.canEdit()]).then(function (r) { return !!(r[0] || r[1]); });
  }).catch(function () { return false; }).then(function (owner) {
    state.isAdmin = !!owner; state.capsReady = true;
    if ((location.hash || '') === '#admin') route(); else renderChrome();
  });
})();
</script>
</body>
</html>
